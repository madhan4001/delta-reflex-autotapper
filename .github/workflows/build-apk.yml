
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Inspect APK signature and permissions
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          test -n "$AAPT"

          echo "=== Signature verification ==="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "=== Package information ==="
          "$AAPT" dump badging "$APK" | head -n 5

          echo "=== Declared permissions ==="
          "$AAPT" dump permissions "$APK"

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: delta-reflex-autotapper-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
